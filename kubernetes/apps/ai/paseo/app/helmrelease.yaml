---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paseo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      paseo:
        forceRename: *app
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/getpaseo/paseo
              tag: 0.15.4@sha256:d9c05730c66a6b64a708303e7cfa6a4009f31f89507bf986fb5b098af25a1c3f
            env:
              PASEO_LISTEN: 0.0.0.0:6767
              PASEO_WEB_UI_ENABLED: "true"
              PASEO_HOSTNAMES: &appHost paseo.${SECRET_DOMAIN}
              PASEO_RELAY_ENABLED: "true"
              PASEO_RELAY_ENDPOINT: paseo-relay.ai.svc.cluster.local:4000
              PASEO_RELAY_USE_TLS: "false"
              PASEO_RELAY_PUBLIC_ENDPOINT: paseo-relay.${SECRET_DOMAIN}:443
              PASEO_RELAY_PUBLIC_USE_TLS: "true"
              PASEO_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paseo-secret
                    key: PASEO_PASSWORD
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 6767
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
      hub:
        forceRename: &hub paseo-hub
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            env:
              - name: INIT_POSTGRES_HOST
                value: phobos-rw.database.svc.cluster.local
              - name: INIT_POSTGRES_PORT
                value: "5432"
              - name: INIT_POSTGRES_DBNAME
                valueFrom:
                  secretKeyRef:
                    name: paseo-secret
                    key: POSTGRES_DB
              - name: INIT_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: paseo-secret
                    key: POSTGRES_USER
              - name: INIT_POSTGRES_PASS
                valueFrom:
                  secretKeyRef:
                    name: paseo-secret
                    key: POSTGRES_PASSWORD
              - name: INIT_POSTGRES_SUPER_USER
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_USER
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_PASS
        containers:
          app:
            image:
              repository: ghcr.io/getpaseo/hub
              tag: 0.11.0@sha256:e2d9370644310bc8a6ad2f0859e4910492dd99eacf57208104c34e08a4ed2c45
            envFrom:
              - secretRef:
                  name: paseo-secret
            env:
              - name: POSTGRES_DB
                valueFrom:
                  secretKeyRef:
                    name: paseo-secret
                    key: POSTGRES_DB
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: paseo-secret
                    key: POSTGRES_USER
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: paseo-secret
                    key: POSTGRES_PASSWORD
              - name: DATABASE_URL
                value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@phobos-rw.database.svc.cluster.local:5432/$(POSTGRES_DB)
              - name: PASEO_HUB_AUTH_SECRET
                valueFrom:
                  secretKeyRef:
                    name: paseo-secret
                    key: PASEO_HUB_AUTH_SECRET
              - name: PORT
                value: "3000"
              - name: PASEO_HUB_BIND
                value: 0.0.0.0
              - name: PASEO_HUB_APP_URL
                value: https://paseo-hub.${SECRET_DOMAIN}
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &hubPort 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *hubPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *hubPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
      relay:
        forceRename: &relay paseo-relay
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/getpaseo/paseo-relay
              tag: latest@sha256:9d5c65d4bd2c42a85a5c8ab329f801a7db41dc4c153ca7bfba6c0857b3cdad0d
            env:
              PASEO_RELAY_HOST: 0.0.0.0
              PASEO_RELAY_PORT: "4000"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &relayPort 4000
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: *relayPort
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *relayPort
                  periodSeconds: 30
                  timeoutSeconds: 5
    persistence:
      daemon-home:
        type: persistentVolumeClaim
        forceRename: paseo-daemon-home
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 10Gi
        retain: true
        advancedMounts:
          paseo:
            app:
              - path: /home/paseo
      daemon-workspace:
        type: persistentVolumeClaim
        forceRename: paseo-daemon-workspace
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 10Gi
        retain: true
        advancedMounts:
          paseo:
            app:
              - path: /workspace
    service:
      app:
        forceRename: *app
        controller: *app
        ports:
          http:
            port: *port
      hub:
        forceRename: *hub
        controller: hub
        ports:
          http:
            port: *hubPort
      relay:
        forceRename: *relay
        controller: relay
        ports:
          http:
            port: *relayPort
    route:
      app:
        hostnames:
          - *appHost
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
            timeouts:
              request: 0s
              backendRequest: 0s
      relay:
        hostnames:
          - paseo-relay.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *relay
                port: *relayPort
            timeouts:
              request: 0s
              backendRequest: 0s
      hub:
        hostnames:
          - paseo-hub.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *hub
                port: *hubPort
            timeouts:
              request: 0s
              backendRequest: 0s
      external:
        hostnames:
          - ph.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - method: POST
                path:
                  type: Exact
                  value: /webhook
            backendRefs:
              - name: *hub
                port: *hubPort
