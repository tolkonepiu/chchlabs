---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  timeout: 10m
  values:
    controllers:
      romarr:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/blizzhacker/romarr
              tag: latest@sha256:cb72e1907ecd69f3a587a95ba6b8ff58d0c6fde9c1d68fadd27b69308204fb92
            env:
              ROMARR_DATA: /config/romarr.json
              ROM_HUB_HOME: /config/rom-hub
              PROWLARR_URL: http://prowlarr.default.svc.cluster.local:9696
              PROWLARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: prowlarr-secret
                    key: PROWLARR__AUTH__APIKEY
              LIBRARY_KIND: romm
              LIBRARY_URL: http://romm.default.svc.cluster.local:8080
              LIBRARY_PATH: /roms
              LIBRARY_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: romarr-secret
                    key: LIBRARY_API_KEY
              ROMARR_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: romarr-secret
                    key: ROMARR_PASSWORD
              ROMARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: romarr-secret
                    key: ROMARR_API_KEY
            ports:
              - name: http
                containerPort: &port 6868
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: romm
              namespaces:
                - default
              topologyKey: kubernetes.io/hostname
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 1Gi
        retain: true
        advancedMounts:
          romarr:
            app:
              - path: /config
                readOnly: false
      library:
        type: persistentVolumeClaim
        existingClaim: romm-library-s3
        advancedMounts:
          romarr:
            app:
              - path: /roms
                subPath: roms
                readOnly: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
