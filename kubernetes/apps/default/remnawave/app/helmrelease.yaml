---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app remnawave
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      remnawave:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: remnawave-secret
            env:
              - name: INIT_POSTGRES_HOST
                value: phobos-rw.database.svc.cluster.local
              - name: INIT_POSTGRES_PORT
                value: "5432"
              - name: INIT_POSTGRES_DBNAME
                valueFrom:
                  secretKeyRef:
                    name: remnawave-secret
                    key: POSTGRES_DB
              - name: INIT_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: remnawave-secret
                    key: POSTGRES_USER
              - name: INIT_POSTGRES_PASS
                valueFrom:
                  secretKeyRef:
                    name: remnawave-secret
                    key: POSTGRES_PASSWORD
              - name: INIT_POSTGRES_SUPER_USER
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_USER
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_PASS
        containers:
          app:
            image:
              repository: ghcr.io/remnawave/backend
              tag: 3.4.5@sha256:b16d724b90fd7c9fec2df04bd28938a671cafc62894105068e11550ee3449c56
            envFrom:
              - secretRef:
                  name: remnawave-secret
            env:
              - name: DATABASE_URL
                value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@phobos-rw.database.svc.cluster.local:5432/$(POSTGRES_DB)
              - name: REDIS_HOST
                value: valkey.database.svc.cluster.local
              - name: REDIS_PORT
                value: "6379"
              - name: REDIS_DB
                value: "0"
              - name: APP_PORT
                value: &port 3000
              - name: METRICS_PORT
                value: &metricsPort 3001
              - name: PANEL_DOMAIN
                value: "{{ .Release.Name }}.${SECRET_DOMAIN}"
              - name: FRONT_END_DOMAIN
                value: "{{ .Release.Name }}.${SECRET_DOMAIN}"
              - name: PM2_HOME
                value: /tmp/.pm2
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
      external:
        hostnames:
          - "rv.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/sub/
            backendRefs:
              - name: *app
                port: *port
          - matches:
              - path:
                  type: Exact
                  value: /api/system/metadata
            backendRefs:
              - name: *app
                port: *port
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/subscription-page-configs
            backendRefs:
              - name: *app
                port: *port
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/subscriptions/subpage-config/
            backendRefs:
              - name: *app
                port: *port
