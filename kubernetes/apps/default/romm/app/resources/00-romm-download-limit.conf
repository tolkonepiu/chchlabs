# One global ROM download slot shared by all clients; HEAD probes remain exempt.
# Use the original request URI so X-Accel internal redirects retain the key.
map "$request_method:$request_uri" $romm_download_key {
    default "";
    ~^GET:/api/roms/download(?:\?|$) "romm";
    ~^GET:/api/roms/[0-9]+/(?:files/)?content/ "romm";
}

limit_conn_zone $romm_download_key zone=romm_downloads:1m;
limit_conn romm_downloads 1;
# Reject excess downloads with 429 rather than queueing them.
limit_conn_status 429;
