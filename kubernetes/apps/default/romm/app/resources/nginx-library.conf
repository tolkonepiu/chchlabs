# Downloads and streaming mod_zip subrequests use this internal route.
# Cached ZIPs retain the stock /cache/ route and filesystem build behavior.
location ^~ /library/ {
    internal;
    # A fixed URI strips /library/ and safely re-escapes the decoded path.
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    # Keep RomM's X-Accel-Redirect Content-Disposition, not object metadata.
    proxy_hide_header Content-Disposition;
    proxy_buffering off;
}
