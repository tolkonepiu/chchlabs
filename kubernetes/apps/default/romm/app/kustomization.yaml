---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./volume.yaml
configMapGenerator:
  - name: romm-configmap
    files:
      - config.yml=./resources/config.yml
  - name: romm-nginx-download-limit
    files:
      - 00-romm-download-limit.conf=./resources/00-romm-download-limit.conf
generatorOptions:
  disableNameSuffixHash: true
