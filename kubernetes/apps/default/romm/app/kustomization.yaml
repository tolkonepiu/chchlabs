---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./volume.yaml
configMapGenerator:
  - name: romm-configmap
    files:
      - config.yml=./resources/config.yml
      - nginx.conf.template=./resources/nginx.conf.template
      - s3-server.conf=./resources/s3-server.conf
generatorOptions:
  disableNameSuffixHash: true
