---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-library
spec:
  storageClassName: ""
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: default
    name: romm-library
  csi:
    driver: ru.yandex.s3.csi
    volumeHandle: romm-library
    controllerPublishSecretRef:
      name: csi-s3
      namespace: kube-system
    nodePublishSecretRef:
      name: csi-s3
      namespace: kube-system
    nodeStageSecretRef:
      name: csi-s3
      namespace: kube-system
    volumeAttributes:
      capacity: 10Ti
      mounter: geesefs
      options: >-
        --memory-limit 1000
        --dir-mode 0777
        --file-mode 0666
        --no-systemd
        --fsync-on-close
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-library
  namespace: default
spec:
  storageClassName: ""
  volumeName: romm-library
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Ti
