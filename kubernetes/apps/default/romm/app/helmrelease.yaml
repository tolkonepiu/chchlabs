---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  # Initial database migrations may use the full startup probe budget.
  timeout: 15m
  values:
    controllers:
      romm:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            env:
              - name: INIT_POSTGRES_HOST
                value: phobos-rw.database.svc.cluster.local
              - name: INIT_POSTGRES_PORT
                value: "5432"
              - name: INIT_POSTGRES_DBNAME
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: DB_NAME
              - name: INIT_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: DB_USER
              - name: INIT_POSTGRES_PASS
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: DB_PASSWD
              - name: INIT_POSTGRES_SUPER_USER
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_USER
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_PASS
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.4.0@sha256:03295f95a6290e752641f9553ac4198b0e5b71b879d57f7b2371b98f608feb54
            envFrom:
              - secretRef:
                  name: romm-secret
            env:
              ROMM_DB_DRIVER: postgresql
              DB_HOST: phobos-rw.database.svc.cluster.local
              DB_PORT: "5432"
              REDIS_HOST: valkey.database.svc.cluster.local
              REDIS_PORT: "6379"
              # Dedicated logical database to avoid sharing queue keys.
              REDIS_DB: "1"
              HASHEOUS_API_ENABLED: "true"
              PLAYMATCH_API_ENABLED: "true"
              HLTB_API_ENABLED: "true"
            ports:
              - name: http
                containerPort: &port 8080
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
      library-backup:
        type: cronjob
        cronjob:
          schedule: "0 3 * * *"
          timeZone: Etc/UTC
          suspend: false
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 3600
          backoffLimit: 1
          activeDeadlineSeconds: 21600
          successfulJobsHistory: 1
          failedJobsHistory: 2
        pod:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: romm
                      app.kubernetes.io/instance: "{{ .Release.Name }}"
                      app.kubernetes.io/controller: romm
        containers:
          backup:
            image:
              repository: rclone/rclone
              tag: 1.74.4@sha256:c61954aaa32328a5486715dd063a81c7879f5195ad3505cd362deddd509dc4a1
            env:
              RCLONE_CONFIG: /dev/null
              RCLONE_CONFIG_S3_TYPE: s3
              RCLONE_CONFIG_S3_PROVIDER: Other
              RCLONE_CONFIG_S3_FORCE_PATH_STYLE: "true"
              HOME: /tmp
              XDG_CACHE_HOME: /tmp
              TMPDIR: /tmp
              RCLONE_CONFIG_S3_ENDPOINT:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: RCLONE_CONFIG_S3_ENDPOINT
              RCLONE_CONFIG_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: RCLONE_CONFIG_S3_ACCESS_KEY_ID
              RCLONE_CONFIG_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
              ROMM_BACKUP_S3_BUCKET:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: ROMM_BACKUP_S3_BUCKET
            command: ["rclone"]
            args:
              - copy
              - /romm/library
              - "s3:$(ROMM_BACKUP_S3_BUCKET)"
              - --config=/dev/null
              - --cache-dir=/tmp/rclone
              - --log-level=INFO
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      library:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 50Gi
        retain: true
        advancedMounts:
          romm:
            app:
              - path: /romm/library
                readOnly: false
          library-backup:
            backup:
              - path: /romm/library
                readOnly: true
      backup-tmp:
        type: emptyDir
        advancedMounts:
          library-backup:
            backup:
              - path: /tmp
      resources:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 10Gi
        retain: true
        advancedMounts:
          romm:
            app:
              - path: /romm/resources
                readOnly: false
      assets:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 10Gi
        retain: true
        advancedMounts:
          romm:
            app:
              - path: /romm/assets
                readOnly: false
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 1Gi
        retain: true
        advancedMounts:
          romm:
            app:
              - path: /romm/config
                readOnly: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
