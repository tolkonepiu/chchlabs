---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  # Initial database migrations may use the full startup probe budget.
  timeout: 15m
  values:
    controllers:
      romm:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
            env:
              - name: INIT_POSTGRES_HOST
                value: phobos-rw.database.svc.cluster.local
              - name: INIT_POSTGRES_PORT
                value: "5432"
              - name: INIT_POSTGRES_DBNAME
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: DB_NAME
              - name: INIT_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: DB_USER
              - name: INIT_POSTGRES_PASS
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: DB_PASSWD
              - name: INIT_POSTGRES_SUPER_USER
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_USER
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_PASS
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
            # The image entrypoint renders nginx first; patch only /library/.
            # /init is the upstream CMD: review this on image upgrades.
            args:
              - /bin/sh
              - -ec
              - |
                python /romm/config/patch-nginx.py
                nginx -t
                exec /init
            envFrom:
              - secretRef:
                  name: romm-secret
            env:
              ROMM_DB_DRIVER: postgresql
              # The stock unprivileged S3 gateway owns port 8080 inside this Pod.
              ROMM_PORT: "8081"
              ROMM_TMP_PATH: /tmp/romm
              DB_HOST: phobos-rw.database.svc.cluster.local
              DB_PORT: "5432"
              REDIS_HOST: valkey.database.svc.cluster.local
              REDIS_PORT: "6379"
              # Dedicated logical database to avoid sharing queue keys.
              REDIS_DB: "1"
              SCAN_WORKERS: "8"
              HASHEOUS_API_ENABLED: "true"
              PLAYMATCH_API_ENABLED: "true"
              HLTB_API_ENABLED: "true"
              ROM_CONVERTO_ENABLED: "true"
              ENABLE_SCHEDULED_CLEANUP_ORPHANED_RESOURCES: "true"
              SCHEDULED_CLEANUP_ORPHANED_RESOURCES_CRON: "0 5 * * *"
              ENABLE_SCHEDULED_CONVERT_IMAGES_TO_WEBP: "true"
              SCHEDULED_CONVERT_IMAGES_TO_WEBP_CRON: "0 4 * * *"
            ports:
              - name: http
                containerPort: &port 8081
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          s3-gateway:
            image:
              repository: ghcr.io/nginx/nginx-s3-gateway/nginx-oss-s3-gateway
              tag: unprivileged-oss-20260910@sha256:1fb58210941096003b8c5e548c891df91866e4f72d8c2571077df9b100769baa
            env:
              AWS_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: AWS_ACCESS_KEY_ID
              AWS_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: AWS_SECRET_ACCESS_KEY
              S3_SERVER:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: S3_SERVER
              S3_REGION:
                valueFrom:
                  secretKeyRef:
                    name: romm-secret
                    key: S3_REGION
              S3_BUCKET_NAME: romm-library
              S3_SERVER_PORT: "443"
              S3_SERVER_PROTO: https
              S3_STYLE: path
              AWS_SIGS_VERSION: "4"
              ALLOW_DIRECTORY_LIST: "false"
              PROVIDE_INDEX_PAGE: "false"
              APPEND_SLASH_FOR_POSSIBLE_DIRECTORY: "false"
              CORS_ENABLED: "false"
              IPV6_ENABLED: "false"
              PROXY_CACHE_MAX_SIZE: 10g
              PROXY_CACHE_INACTIVE: 24h
              PROXY_CACHE_VALID_OK: 1h
              PROXY_CACHE_SLICE_SIZE: 1m
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  failureThreshold: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 30
            securityContext:
              runAsUser: 101
              runAsGroup: 101
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
                ephemeral-storage: 1Gi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      library:
        type: persistentVolumeClaim
        existingClaim: romm-library-s3
        advancedMounts:
          romm:
            app:
              - path: /romm/library
                readOnly: false
      resources:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 50Gi
        retain: true
        advancedMounts:
          romm:
            app:
              - path: /romm/resources
                readOnly: false
      resources-tmp:
        type: emptyDir
        advancedMounts:
          romm:
            app:
              - path: /romm/resources/tmp
                readOnly: false
      tmp:
        type: emptyDir
        sizeLimit: 100Gi
        advancedMounts:
          romm:
            app:
              - path: /tmp/romm
                readOnly: false
      assets:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 10Gi
        retain: true
        advancedMounts:
          romm:
            app:
              - path: /romm/assets
                readOnly: false
      config-file:
        type: configMap
        name: romm-configmap
        advancedMounts:
          romm:
            app:
              - path: /romm/config/config.yml
                subPath: config.yml
                readOnly: true
              - path: /etc/nginx/romm-library.conf
                subPath: nginx-library.conf
                readOnly: true
              - path: /romm/config/patch-nginx.py
                subPath: patch-nginx.py
                readOnly: true
            s3-gateway:
              - path: /etc/nginx/templates/gateway/s3_server.conf.template
                subPath: s3-server.conf
                readOnly: true
      s3-cache:
        type: emptyDir
        # Full-object and slice caches each have a 10g upstream limit.
        sizeLimit: 22Gi
        advancedMounts:
          romm:
            s3-gateway:
              - path: /var/cache/nginx
    service:
      app:
        controller: *app
        ports:
          http:
            port: &servicePort 8080
            targetPort: http
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *servicePort
