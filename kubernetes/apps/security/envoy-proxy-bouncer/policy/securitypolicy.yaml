---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: envoy-proxy-bouncer
  namespace: network
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  extAuth:
    failOpen: false
    statusOnError: 503
    timeout: 5s
    grpc:
      backendRefs:
        - group: ""
          kind: Service
          name: envoy-proxy-bouncer
          namespace: security
          port: 8080
    headersToExtAuth:
      - ":authority"
      - ":method"
      - ":path"
      - ":scheme"
      - user-agent
      - x-forwarded-for
