---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-proxy-bouncer
spec:
  releaseName: envoy-proxy-bouncer
  chartRef:
    kind: OCIRepository
    name: envoy-proxy-bouncer
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: envoy-proxy-bouncer
            patch: |
              - op: add
                path: /metadata/annotations
                value:
                  secret.reloader.stakater.com/reload: envoy-proxy-bouncer
  values:
    fullnameOverride: envoy-proxy-bouncer
    replicaCount: 2
    image:
      repository: ghcr.io/kdwils/envoy-proxy-bouncer
      tag: v0.8.4@sha256:3c7ff986f04c5f1739989463d2e9553f0e7163f9a55d02d240ed6e794e4078f0
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      trustedIPHeader: ""
      trustedProxies: [10.42.0.0/16]
      exemptIPs: []
      bouncer:
        enabled: true
        lapiURL: http://crowdsec-service.security.svc.cluster.local:8080
        apiKeySecretRef:
          name: envoy-proxy-bouncer
          key: api-key
        tickerInterval: 10s
        metrics: false
      waf:
        enabled: false
      captcha:
        enabled: false
      prometheus:
        enabled: false
    referenceGrant:
      create: true
      fromNamespaces: [network]
