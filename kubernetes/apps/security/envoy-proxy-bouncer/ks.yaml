---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-proxy-bouncer
  namespace: security
spec:
  dependsOn:
    - name: crowdsec
      namespace: security
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-proxy-bouncer
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/security/envoy-proxy-bouncer/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-proxy-bouncer-policy
  namespace: security
spec:
  dependsOn:
    - name: envoy-proxy-bouncer
      namespace: security
    - name: envoy-gateway
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/security/envoy-proxy-bouncer/policy
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  timeout: 5m
  wait: false
