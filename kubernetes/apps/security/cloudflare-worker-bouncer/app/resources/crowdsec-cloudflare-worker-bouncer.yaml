cloudflare_config:
  accounts:
    - id: ${CLOUDFLARE_ACCOUNT_ID}
      account_name: cloudflare-worker-bouncer
      token: ${CLOUDFLARE_API_TOKEN}
      zones:
        - zone_id: ${CLOUDFLARE_ZONE_ID}
          actions: [ban]
          default_action: ban
          routes_to_protect:
            - "*${SECRET_DOMAIN}/*"
          turnstile:
            enabled: false
crowdsec_config:
  lapi_url: http://crowdsec-service.security.svc.cluster.local:8080/
  lapi_key: ${CROWDSEC_LAPI_KEY}
  update_frequency: 10s
  include_scenarios_containing: []
  exclude_scenarios_containing: []
  only_include_decisions_from: [crowdsec, cscli]
log_mode: stdout
log_level: info
prometheus:
  enabled: false
