---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crowdsec-lapi
spec:
  hostnames: ["crowdsec-lapi.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: crowdsec-service
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
