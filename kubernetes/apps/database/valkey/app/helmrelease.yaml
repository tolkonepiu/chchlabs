---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name valkey
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  values:
    replica:
      enabled: false
    dataStorage:
      enabled: false
    auth:
      enabled: false
    tls:
      enabled: false
    valkeyConfig: |
      cluster-enabled no
      maxmemory 384mb
      maxmemory-policy noeviction
      save ""
      appendonly no
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    readinessProbe:
      enabled: true
    livenessProbe:
      enabled: true
