---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name valkey-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  values:
    replicaCount: 2
    manager:
      leaderElection:
        enabled: true
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
    podDisruptionBudget:
      enabled: false
