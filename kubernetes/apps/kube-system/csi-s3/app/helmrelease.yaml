---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-s3
spec:
  chartRef:
    kind: OCIRepository
    name: csi-s3
  interval: 1h
  values:
    secret:
      create: false
      name: csi-s3
    storageClass:
      create: true
      name: csi-s3
      reclaimPolicy: Retain
      mountOptions: "--memory-limit 1000 --dir-mode 0777 --file-mode 0666 --no-systemd"
