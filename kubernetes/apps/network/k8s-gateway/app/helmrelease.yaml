---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      loadBalancerClass: tailscale
      port: 53
      useTcp: true
      annotations:
        tailscale.com/hostname: internal-dns
      externalTrafficPolicy: Cluster
    filters:
      gatewayClasses: [tailscale]
    watchedResources: ["HTTPRoute"]
    fallthrough:
      enabled: true
      zones: ["${SECRET_DOMAIN}"]
