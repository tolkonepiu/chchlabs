---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    deployment:
      dnsPolicy: ClusterFirst
    securityContext:
      runAsUser: 1000
      capabilities:
        add: [NET_BIND_SERVICE]
    serviceType: LoadBalancer
    service:
      loadBalancerClass: tailscale
      annotations:
        tailscale.com/hostname: internal-dns
      externalTrafficPolicy: Cluster
    servers:
      - port: 53
        zones:
          - zone: "."
            scheme: dns://
            use_tcp: true
        plugins:
          - name: k8s_gateway
            parameters: "${SECRET_DOMAIN}"
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources HTTPRoute
              gatewayClasses tailscale
              fallthrough ${SECRET_DOMAIN}
          - name: log
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
